# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --stacktrace
      - name: server startup and Carpet fake-player integration test
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          printf '%s\n' 'online-mode=false' 'server-ip=127.0.0.1' 'enable-rcon=true' "rcon.password=$(openssl rand -hex 24)" 'rcon.port=25575' > run/server.properties
          ./gradlew runServer --console=plain > server-startup.log 2>&1 &
          gradle_pid=$!
          trap 'kill "$gradle_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 150); do
            if grep -Fq 'Done (' server-startup.log; then
              echo "Minecraft server reported successful startup"
              if ! python3 scripts/rcon_smoke.py; then
                tail -n 180 server-startup.log
                exit 1
              fi
              tail -n 80 server-startup.log
              exit 0
            fi
            if ! kill -0 "$gradle_pid" 2>/dev/null; then
              echo "Server process ended before startup"
              tail -n 150 server-startup.log
              exit 1
            fi
            sleep 1
          done
          echo "Server startup timed out"
          tail -n 150 server-startup.log
          exit 1
      - name: capture server startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ServerStartupLog
          path: server-startup.log
          if-no-files-found: ignore
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
