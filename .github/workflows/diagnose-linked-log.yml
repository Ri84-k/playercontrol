name: Diagnose linked PlayerControl error (temporary)
on:
  push:
    branches: [fabric-26.2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Extract PlayerControl failure stack traces from public mclo.gs log
        env:
          LOG_URL: https://api.mclo.gs/1/raw/J5c26pH
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, urllib.request
          req=urllib.request.Request(os.environ["LOG_URL"],headers={"User-Agent":"PlayerControl-port-diagnostic/1.0"})
          with urllib.request.urlopen(req,timeout=25) as r:
              body=r.read(10_000_001)
          if len(body)>10_000_000:
              raise RuntimeError("Log exceeds diagnostic cap")
          lines=body.decode("utf-8","replace").splitlines()
          print("Fetched log: {} lines".format(len(lines)))
          terms=("Failed restoring player snapshot", "Player swap failed", "Failed restoring", "Incomplete swap rollback", "java.lang.UnsupportedOperationException","Caused by:", "PlayerSkinRefresher", "SwapSnapshot", "PlayerSwapManager")
          hits=[i for i,line in enumerate(lines) if any(t in line for t in terms)]
          shown=set()
          for index in hits[:35]:
              for j in range(max(0,index-2),min(len(lines),index+14)):
                  if j not in shown:
                      shown.add(j)
                      sanitized=re.sub(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}","[UUID]",lines[j], flags=re.I)
                      sanitized=re.sub(r"(?<!\w)(?:\d{1,3}\.){3}\d{1,3}(?!\w)","[IP]",sanitized)
                      print(f"{j+1}: {sanitized[:450]}")
          if not hits:
              print("No PlayerControl-specific errors found; please upload server latest.log directly.")
          PY
